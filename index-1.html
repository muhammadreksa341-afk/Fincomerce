<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>FINCOMMERCE</title>
<style>
:root{--bg:#f6f7fb;--c:#fff;--t:#1a2233;--m:#667085;--p:#0f9d78;--b:#e4e7ec;--r:#d92d20;--w:#f79009;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e131b;--c:#161d29;--t:#e8ecf3;--m:#98a2b3;--b:#263041}}
:root[data-theme=dark]{--bg:#0e131b;--c:#161d29;--t:#e8ecf3;--m:#98a2b3;--b:#263041}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--t);font:15px system-ui,sans-serif}
#app{display:flex;min-height:100vh}nav{width:220px;background:var(--c);border-right:1px solid var(--b);padding:16px;position:sticky;top:0;height:100vh;flex-shrink:0}
nav b{display:block;font-size:18px;color:var(--p);margin-bottom:16px}nav a{display:block;padding:10px;border-radius:8px;color:var(--t);text-decoration:none;margin-bottom:2px}nav a.on{background:var(--p);color:#fff}
main{flex:1;min-width:0;padding:20px;max-width:1100px}h1{font-size:22px;margin:0 0 14px}h2{font-size:16px;margin:0 0 10px}
.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:14px}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:14px;min-width:0}.card small{color:var(--m)}.card strong{display:block;font-size:19px;margin-top:4px;overflow-wrap:anywhere}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:520px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--b);white-space:nowrap}th{color:var(--m);font-weight:500}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--b);border-radius:8px;background:var(--bg);color:var(--t);font:inherit}
label{display:block;font-size:13px;color:var(--m);margin:8px 0 3px}
button{background:var(--p);color:#fff;border:0;border-radius:8px;padding:9px 14px;font:inherit;cursor:pointer}button.s{background:var(--bg);color:var(--t);border:1px solid var(--b);padding:5px 9px;font-size:13px}button.d{background:var(--r)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}.bar>*{width:auto;flex:1 1 130px}.bar button{flex:0 0 auto}
.ov{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:16px;z-index:9}.md{background:var(--c);border-radius:12px;padding:18px;width:100%;max-width:560px}
.it{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:6px;margin-bottom:6px}
.tag{padding:2px 8px;border-radius:99px;font-size:12px;color:#fff}.empty{text-align:center;padding:30px;color:var(--m)}
.hero{max-width:720px;margin:8vh auto;text-align:center;padding:20px}.hero h1{font-size:34px}
@media(max-width:760px){nav{position:fixed;bottom:0;top:auto;left:0;right:0;width:100%;height:auto;display:flex;overflow-x:auto;padding:6px;z-index:5;border-top:1px solid var(--b);border-right:0}nav b{display:none}nav a{white-space:nowrap;font-size:12px;padding:8px 10px}main{padding:14px 12px 80px}.it{grid-template-columns:1fr 1fr}}
</style></head><body><div id="app"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rp=n=>'Rp'+Math.round(n||0).toLocaleString('id-ID');
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const MP=['Shopee','Tokopedia','TikTok Shop','Lazada','Website','Offline','Lainnya'],PAY=['Transfer','COD','E-Wallet','Cash','Lainnya'],
EC=['Iklan','Packing','Ongkir','Admin Marketplace','Gaji','Listrik','Internet','Sewa','Perlengkapan','Lainnya'];
let db,base,S={p:[],t:[],e:[]},R={k:'month',f:'',t:''},Q={q:'',mp:'',cat:'',f:'',t:'',pg:1},ready=false,edit=null;
const opt=(a,v,all)=>(all?`<option value="">${all}</option>`:'')+a.map(x=>`<option ${x==v?'selected':''}>${esc(x)}</option>`).join('');
const toast=m=>alert(m);
let SB_URL=localStorage.getItem('sbu')||'',SB_KEY=localStorage.getItem('sbk')||'';
if(typeof supabase==='undefined'){$('#app').innerHTML='<div class="hero">Gagal memuat Supabase. Periksa koneksi internet lalu muat ulang halaman.</div>';throw 'nolib'}
if(!SB_URL.startsWith('http')||SB_KEY.length<20){window.saveCfg=()=>{const u=$('#cu').value.trim(),k=$('#ck').value.trim();if(!u.startsWith('http')||k.length<20)return alert('URL harus diawali https:// dan key harus diisi.');localStorage.setItem('sbu',u);localStorage.setItem('sbk',k);location.reload()};
$('#app').innerHTML='<div class="hero" style="max-width:420px;text-align:left"><b style="color:var(--p)">FINCOMMERCE</b><h1 style="font-size:22px">Pengaturan Supabase</h1><label>Project URL</label><input id="cu" placeholder="https://xxxx.supabase.co"><label>Publishable / anon key</label><input id="ck" placeholder="sb_publishable_..."><div class="bar" style="margin-top:14px"><button onclick="saveCfg()">Simpan</button></div></div>';throw 'nocfg'}
const SB_URL_OK=1;

const sb=supabase.createClient(SB_URL,SB_KEY);let sess=null,authMode='login';
async function reload(){if(!sess)return;
 const [p,t,e]=await Promise.all([sb.from('products').select('*').order('name'),sb.from('transactions').select('*,transaction_items(*)').order('transaction_date',{ascending:false}).limit(2000),sb.from('expenses').select('*').order('date',{ascending:false}).limit(2000)]);
 if(p.error||t.error||e.error){ready='no';return render()}
 S.p=p.data.map(x=>({id:x.id,name:x.name,sku:x.sku,cat:x.category,cost:+x.cost_price,price:+x.selling_price,stock:x.stock,min:x.minimum_stock}));
 S.t=t.data.map(x=>({id:x.id,date:x.transaction_date,no:x.transaction_number,mp:x.marketplace,pay:x.payment_method,notes:x.notes||'',sales:+x.total_sales,cost:+x.total_cost,profit:+x.profit,items:x.transaction_items.map(i=>({pid:i.product_id,name:i.product_name,q:i.quantity,sp:+i.selling_price,cp:+i.cost_price}))}));
 S.e=e.data.map(x=>({id:x.id,date:x.date,cat:x.category,amount:+x.amount,desc:x.description}));
 ready=true;render()}
async function init(){render();
 const {data}=await sb.auth.getSession();sess=data.session;
 sb.auth.onAuthStateChange((_,s)=>{sess=s;if(s){reload()}else{S={p:[],t:[],e:[]};ready=false;render()}});
 if(sess)reload();else render()}
const T={products:d=>({name:d.name,sku:d.sku||null,category:d.cat||null,cost_price:d.cost,selling_price:d.price,stock:d.stock,minimum_stock:d.min}),expenses:d=>({date:d.date,category:d.cat,amount:d.amount,description:d.desc||null})};
const col=c=>({async add(d){const r=await sb.from(c).insert(T[c](d)).select('id').single();if(r.error)throw r.error;await reload();return{id:r.data.id}},
 doc:id=>({async update(d){const r=await sb.from(c).update(T[c](d)).eq('id',id);if(r.error)throw r.error;await reload()},async delete(){const r=await sb.from(c).delete().eq('id',id);if(r.error)throw r.error;await reload()}})});
function authView(){const r=authMode=='register';return`<div class="hero" style="max-width:380px;text-align:left"><b style="color:var(--p)">FINCOMMERCE</b><h1 style="font-size:24px">${r?'Daftar':'Masuk'}</h1>${r?'<label>Nama</label><input id="an">':''}<label>Email</label><input id="ae" type="email"><label>Password</label><input id="ap" type="password"><div class="bar" style="margin-top:14px"><button onclick="doAuth()">${r?'Daftar':'Masuk'}</button></div><p><a href="#/dashboard" onclick="authMode='${r?'login':'register'}';render();return false">${r?'Sudah punya akun? Masuk':'Belum punya akun? Daftar'}</a>${r?'':' · <a href="#/dashboard" onclick="doReset();return false">Lupa password</a>'}</p></div>`}
async function doAuth(){const r=authMode=='register',em=$('#ae').value.trim(),pw=$('#ap').value;if(!em||pw.length<6)return toast('Email wajib diisi dan password minimal 6 karakter.');
 const x=r?await sb.auth.signUp({email:em,password:pw,options:{data:{name:($('#an').value||'').trim()}}}):await sb.auth.signInWithPassword({email:em,password:pw});
 if(x.error)return toast('Email atau password tidak valid.');if(r&&!x.data.session)toast('Pendaftaran berhasil. Cek email Anda untuk konfirmasi, lalu masuk.')}
async function doReset(){const em=$('#ae').value.trim();if(!em)return toast('Isi email terlebih dahulu.');const x=await sb.auth.resetPasswordForEmail(em);toast(x.error?'Terjadi kesalahan. Silakan coba lagi.':'Link reset password dikirim ke email Anda.')}
function rng(k){const n=new Date(),y=n.getFullYear(),m=n.getMonth();
 if(k=='today')return[iso(n),iso(n)];if(k=='7')return[iso(new Date(n-6*864e5)),iso(n)];
 if(k=='month')return[iso(new Date(y,m,1)),iso(new Date(y,m+1,0))];if(k=='last')return[iso(new Date(y,m-1,1)),iso(new Date(y,m,0))];
 if(k=='year')return[y+'-01-01',y+'-12-31'];return[R.f||'0000',R.t||'9999']}
const inR=(d,[a,b])=>d>=a&&d<=b;
function calc(r){const t=S.t.filter(x=>inR(x.date,r)),e=S.e.filter(x=>inR(x.date,r));
 const o=t.reduce((a,x)=>a+x.sales,0),m=t.reduce((a,x)=>a+x.cost,0),x=e.reduce((a,y)=>a+y.amount,0);
 return{t,e,o,m,gross:o-m,x,net:o-m-x,mg:o?(o-m-x)/o*100:0}}
function rsel(){return`<div class="bar"><select onchange="R.k=this.value;render()">${[['today','Hari ini'],['7','7 hari'],['month','Bulan ini'],['last','Bulan lalu'],['year','Tahun ini'],['custom','Custom tanggal']].map(([v,l])=>`<option value="${v}" ${R.k==v?'selected':''}>${l}</option>`).join('')}</select>${R.k=='custom'?`<input type="date" value="${R.f}" onchange="R.f=this.value;render()"><input type="date" value="${R.t}" onchange="R.t=this.value;render()">`:''}</div>`}
const card=(l,v)=>`<div class="card"><small>${l}</small><strong>${v}</strong></div>`;
function chart(title,vals,labs,col){const mx=Math.max(...vals,1);return`<div class="card"><h2>${title}</h2><svg viewBox="0 0 280 120" style="width:100%">${vals.map((v,i)=>{const h=v/mx*85;return`<rect x="${i*40+6}" y="${95-h}" width="28" height="${h}" rx="4" fill="${col}"><title>${rp(v)}</title></rect><text x="${i*40+20}" y="112" font-size="10" text-anchor="middle" fill="currentColor">${labs[i]}</text>`}).join('')}</svg></div>`}
const days7=()=>[...Array(7)].map((_,i)=>iso(new Date(Date.now()-(6-i)*864e5)));
const empty=(m,b,f)=>`<div class="empty">${m}<br><br><button onclick="${f}">${b}</button></div>`;
const stat=p=>p.stock<=0?['Stok Habis','var(--r)']:p.stock<=p.min?['Stok Menipis','var(--w)']:['Stok Aman','var(--p)'];
function agg(t){const m={};t.forEach(x=>x.items.forEach(i=>{const a=m[i.name]||(m[i.name]={n:i.name,q:0,o:0,l:0});a.q+=i.q;a.o+=i.q*i.sp;a.l+=i.q*(i.sp-i.cp)}));return Object.values(m)}
const tbl=(h,rows)=>`<div class="card sc"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.join('')}</table></div>`;
const V={
dash(){const r=rng('month'),c=calc(r),ds=days7(),f=(a,g)=>ds.map(d=>a.filter(x=>x.date==d).reduce((s,x)=>s+g(x),0)),lb=ds.map(d=>d.slice(8));
 const low=[...S.p].sort((a,b)=>a.stock-b.stock).slice(0,5),top=agg(c.t).sort((a,b)=>b.q-a.q).slice(0,5);
 if(!S.t.length&&!S.p.length)return`<h1>Dashboard</h1>`+empty('Belum ada transaksi.','+ Tambah Transaksi',"go('transactions')")+`<p class="empty"><button class="s" onclick="demo()">Gunakan Data Demo</button></p>`;
 const ex=f(S.e,x=>x.amount),sa=f(S.t,x=>x.sales),pr=f(S.t,x=>x.profit).map((v,i)=>v-ex[i]);
 return`<h1>Dashboard</h1><div class="g">${card('Omzet Bulan Ini',rp(c.o))}${card('Modal Bulan Ini',rp(c.m))}${card('Pengeluaran Bulan Ini',rp(c.x))}${card('Laba Bersih',rp(c.net))}${card('Jumlah Transaksi',c.t.length)}${card('Nilai Stok',rp(S.p.reduce((a,p)=>a+p.stock*p.cost,0)))}</div>
 <div class="g">${chart('Omzet 7 hari',sa,lb,'#0f9d78')}${chart('Pengeluaran 7 hari',ex,lb,'#f79009')}${chart('Laba 7 hari',pr.map(v=>Math.max(v,0)),lb,'#3b82f6')}</div>
 <div class="g"><div><h2>Produk Terlaris</h2>${top.length?tbl(['Produk','Terjual'],top.map(x=>`<tr><td>${esc(x.n)}</td><td>${x.q}</td></tr>`)):'<div class="card empty">Belum ada penjualan.</div>'}</div>
 <div><h2>Stok Menipis</h2>${low.length?tbl(['Produk','Stok'],low.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.stock}</td></tr>`)):'<div class="card empty">Belum ada produk.</div>'}</div></div>`},
tx(){let l=S.t.filter(x=>(!Q.q||(x.no+x.notes+x.items.map(i=>i.name).join()).toLowerCase().includes(Q.q.toLowerCase()))&&(!Q.mp||x.mp==Q.mp)&&(!Q.f||x.date>=Q.f)&&(!Q.t||x.date<=Q.t)).sort((a,b)=>b.date.localeCompare(a.date)||b.no.localeCompare(a.no));
 const n=Math.max(1,Math.ceil(l.length/10));Q.pg=Math.min(Q.pg,n);const pg=l.slice((Q.pg-1)*10,Q.pg*10);
 return`<h1>Transaksi</h1><div class="bar"><input placeholder="Cari..." value="${esc(Q.q)}" onchange="Q.q=this.value;Q.pg=1;render()"><select onchange="Q.mp=this.value;Q.pg=1;render()">${opt(MP,Q.mp,'Semua marketplace')}</select><input type="date" value="${Q.f}" onchange="Q.f=this.value;render()"><input type="date" value="${Q.t}" onchange="Q.t=this.value;render()"><button onclick="txForm()">+ Tambah Transaksi</button></div>`+
 (S.t.length?tbl(['Tanggal','No','Marketplace','Omzet','Laba','Aksi'],pg.map(x=>`<tr><td>${x.date}</td><td>${esc(x.no)}</td><td>${esc(x.mp)}</td><td>${rp(x.sales)}</td><td>${rp(x.profit)}</td><td><button class="s" onclick="txDetail('${x.id}')">Detail</button> <button class="s" onclick="txForm('${x.id}')">Edit</button> <button class="s d" onclick="txDel('${x.id}')">Hapus</button></td></tr>`))+`<div class="bar" style="margin-top:10px"><button class="s" ${Q.pg<2?'disabled':''} onclick="Q.pg--;render()">‹</button><span style="flex:0">${Q.pg}/${n}</span><button class="s" ${Q.pg>=n?'disabled':''} onclick="Q.pg++;render()">›</button></div>`:empty('Belum ada transaksi.','+ Tambah Transaksi','txForm()'))},
prod(){let l=S.p.filter(x=>(!Q.q||(x.name+x.sku).toLowerCase().includes(Q.q.toLowerCase()))&&(!Q.cat||x.cat==Q.cat));const cats=[...new Set(S.p.map(x=>x.cat).filter(Boolean))];
 return`<h1>Produk & Stok</h1><div class="bar"><input placeholder="Cari..." value="${esc(Q.q)}" onchange="Q.q=this.value;render()"><select onchange="Q.cat=this.value;render()">${opt(cats,Q.cat,'Semua kategori')}</select><button onclick="pForm()">+ Tambah Produk</button></div>`+
 (S.p.length?tbl(['Produk','SKU','Kategori','Modal','Jual','Stok','Status','Nilai','Aksi'],l.map(x=>{const s=stat(x);return`<tr><td>${esc(x.name)}</td><td>${esc(x.sku)}</td><td>${esc(x.cat)}</td><td>${rp(x.cost)}</td><td>${rp(x.price)}</td><td>${x.stock}</td><td><span class="tag" style="background:${s[1]}">${s[0]}</span></td><td>${rp(x.stock*x.cost)}</td><td><button class="s" onclick="pForm('${x.id}')">Edit</button> <button class="s d" onclick="pDel('${x.id}')">Hapus</button></td></tr>`})):empty('Belum ada produk.','+ Tambah Produk','pForm()'))},
exp(){let l=S.e.filter(x=>(!Q.q||(x.desc||'').toLowerCase().includes(Q.q.toLowerCase()))&&(!Q.cat||x.cat==Q.cat)&&(!Q.f||x.date>=Q.f)&&(!Q.t||x.date<=Q.t)).sort((a,b)=>b.date.localeCompare(a.date));
 return`<h1>Pengeluaran</h1><div class="bar"><input placeholder="Cari..." value="${esc(Q.q)}" onchange="Q.q=this.value;render()"><select onchange="Q.cat=this.value;render()">${opt(EC,Q.cat,'Semua kategori')}</select><input type="date" value="${Q.f}" onchange="Q.f=this.value;render()"><input type="date" value="${Q.t}" onchange="Q.t=this.value;render()"><button onclick="eForm()">+ Tambah Pengeluaran</button></div>`+
 (S.e.length?tbl(['Tanggal','Kategori','Nominal','Keterangan','Aksi'],l.map(x=>`<tr><td>${x.date}</td><td>${esc(x.cat)}</td><td>${rp(x.amount)}</td><td>${esc(x.desc)}</td><td><button class="s" onclick="eForm('${x.id}')">Edit</button> <button class="s d" onclick="eDel('${x.id}')">Hapus</button></td></tr>`)):empty('Belum ada pengeluaran.','+ Tambah Pengeluaran','eForm()'))},
profit(){const c=calc(rng(R.k));return`<h1>Laba Bersih</h1>${rsel()}<div class="g">${card('Omzet',rp(c.o))}${card('Modal',rp(c.m))}${card('Laba Kotor',rp(c.gross))}${card('Pengeluaran',rp(c.x))}${card('Laba Bersih',rp(c.net))}${card('Margin',c.mg.toFixed(1).replace('.',',')+'%')}</div>`},
rep(){const c=calc(rng(R.k)),a=agg(c.t),by={};c.e.forEach(x=>by[x.cat]=(by[x.cat]||0)+x.amount);const top=(k)=>[...a].sort((x,y)=>y[k]-x[k]).slice(0,5);
 const t3=(h,k,f)=>top(k).length?tbl([h,'Nilai'],top(k).map(x=>`<tr><td>${esc(x.n)}</td><td>${f(x[k])}</td></tr>`)):'<div class="card empty">Belum ada data.</div>';
 return`<h1>Laporan</h1>${rsel()}<button class="s" onclick="csv()">Export CSV</button><h2 style="margin-top:14px">Penjualan</h2><div class="g">${card('Transaksi',c.t.length)}${card('Produk Terjual',a.reduce((s,x)=>s+x.q,0))}${card('Omzet',rp(c.o))}${card('Modal',rp(c.m))}${card('Laba',rp(c.gross))}</div>
 <h2>Pengeluaran</h2><div class="g">${card('Total',rp(c.x))}</div>${Object.keys(by).length?tbl(['Kategori','Total'],Object.entries(by).map(([k,v])=>`<tr><td>${k}</td><td>${rp(v)}</td></tr>`)):'<div class="card empty">Belum ada pengeluaran.</div>'}
 <h2 style="margin-top:14px">Produk</h2><div class="g"><div>Terlaris${t3('Produk','q',x=>x)}</div><div>Omzet terbesar${t3('Produk','o',rp)}</div><div>Laba terbesar${t3('Produk','l',rp)}</div></div>
 <div class="g"><div>Stok menipis${tbl(['Produk','Stok'],S.p.filter(p=>p.stock>0&&p.stock<=p.min).map(p=>`<tr><td>${esc(p.name)}</td><td>${p.stock}</td></tr>`))}</div><div>Stok habis${tbl(['Produk'],S.p.filter(p=>p.stock<=0).map(p=>`<tr><td>${esc(p.name)}</td></tr>`))}</div></div>`},
set(){return`<h1>Pengaturan</h1><div class="card"><p>Data Anda tersimpan di Supabase dan hanya dapat diakses oleh akun Anda.</p><button onclick="demo()">Gunakan Data Demo</button> <button class="s" onclick="sb.auth.signOut()">Keluar</button></div>`}};
const NAV=[['dashboard','📊 Dashboard','dash'],['transactions','🛒 Transaksi','tx'],['products','📦 Produk & Stok','prod'],['expenses','💸 Pengeluaran','exp'],['profit','📈 Laba Bersih','profit'],['reports','📋 Laporan','rep'],['settings','⚙️ Pengaturan','set']];
function go(p){location.hash='#/'+p}
window.onhashchange=()=>{Q={q:'',mp:'',cat:'',f:'',t:'',pg:1};render()};
function render(){const p=(location.hash.replace('#/','')||'');const h=NAV.find(n=>n[0]==p);
 if(!h)return $('#app').innerHTML=`<div class="hero"><b style="color:var(--p)">FINCOMMERCE</b><h1>Kelola Keuangan Toko Online Tanpa Ribet.</h1><p>Catat transaksi, pantau stok, hitung keuntungan, dan lihat perkembangan bisnis Anda dalam satu aplikasi.</p><button onclick="go('dashboard')">Mulai Gratis</button><div class="g" style="margin-top:30px;text-align:left">${card('Semua Lebih Teratur','Catat transaksi dengan mudah.')}${card('Tahu Keuntungan','Lihat laba bisnis secara otomatis.')}${card('Pantau Stok','Ketahui produk yang hampir habis.')}</div><small>Catat. Pantau. Untung.</small></div>`;
 if(!sess)return $('#app').innerHTML=authView();if(ready!==true)return $('#app').innerHTML=`<div class="hero">${ready=='no'?'Terjadi kesalahan. Silakan muat ulang halaman.':'Memuat...'}</div>`;
 const y=scrollY;$('#app').innerHTML=`<nav><b>FINCOMMERCE</b>${NAV.map(n=>`<a href="#/${n[0]}" class="${n[0]==p?'on':''}">${n[1]}</a>`).join('')}</nav><main>${V[h[2]]()}</main>`;scrollTo(0,y)}
const fld=(l,id,t,v,x='')=>`<label>${l}</label><input id="${id}" type="${t}" value="${esc(v??'')}" ${x}>`;
function modal(t,body,save){const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="md"><h2>${t}</h2>${body}<div class="bar" style="margin-top:14px"><button class="s" id="mx">Batal</button>${save?'<button id="ms">Simpan</button>':''}</div></div>`;document.body.appendChild(o);
 o.querySelector('#mx').onclick=()=>o.remove();if(save)o.querySelector('#ms').onclick=async()=>{try{if(await save()!==false)o.remove()}catch(e){toast('Terjadi kesalahan. Silakan coba lagi.')}}}
const v=id=>$('#'+id).value.trim(),today=()=>iso(new Date());
function pForm(id){const p=S.p.find(x=>x.id==id)||{};modal(id?'Edit Produk':'Tambah Produk',fld('Nama produk','a','text',p.name)+fld('SKU','b','text',p.sku)+fld('Kategori','c','text',p.cat)+fld('Harga modal','d','number',p.cost,'min=0')+fld('Harga jual','e','number',p.price,'min=0')+fld('Stok','f','number',p.stock,'min=0')+fld('Minimum stok','g','number',p.min??5,'min=0'),async()=>{
 const d={name:v('a'),sku:v('b'),cat:v('c'),cost:+v('d'),price:+v('e'),stock:+v('f'),min:+v('g')};
 if(!d.name)return toast('Nama produk wajib diisi.'),false;if(v('e')==='')return toast('Harga jual wajib diisi.'),false;
 if([d.cost,d.price,d.stock,d.min].some(n=>isNaN(n)||n<0))return toast('Harga dan stok tidak boleh negatif.'),false;
 id?await col('products').doc(id).update(d):await col('products').add(d)})}
async function pDel(id){if(confirm('Hapus produk ini?'))await col('products').doc(id).delete()}
function eForm(id){const e=S.e.find(x=>x.id==id)||{};modal(id?'Edit Pengeluaran':'Tambah Pengeluaran',fld('Tanggal','a','date',e.date||today())+`<label>Kategori</label><select id="b">${opt(EC,e.cat)}</select>`+fld('Nominal','c','number',e.amount,'min=0')+fld('Keterangan','d','text',e.desc),async()=>{
 const d={date:v('a'),cat:v('b'),amount:+v('c'),desc:v('d')};if(!d.date||!v('c')||d.amount<=0)return toast('Tanggal dan nominal wajib diisi dengan benar.'),false;
 id?await col('expenses').doc(id).update(d):await col('expenses').add(d)})}
async function eDel(id){if(confirm('Hapus pengeluaran ini?'))await col('expenses').doc(id).delete()}
function row(i={}){return`<div class="it"><select class="ip" onchange="pick(this)"><option value="">Produk...</option>${S.p.map(p=>`<option value="${p.id}" ${p.id==i.pid?'selected':''}>${esc(p.name)} (${p.stock})</option>`).join('')}</select><input class="iq" type="number" min="1" placeholder="Qty" value="${i.q||''}"><input class="is" type="number" min="0" placeholder="Harga jual" value="${i.sp??''}"><input class="ic" type="number" min="0" placeholder="Modal" value="${i.cp??''}"><button class="s d" onclick="this.parentNode.remove()">×</button></div>`}
function pick(s){const p=S.p.find(x=>x.id==s.value),r=s.parentNode;if(p){r.querySelector('.is').value=p.price;r.querySelector('.ic').value=p.cost}}
function txForm(id){if(!S.p.length)return toast('Tambahkan produk terlebih dahulu.'),go('products');const t=S.t.find(x=>x.id==id)||{items:[{}]};
 modal(id?'Edit Transaksi':'Tambah Transaksi',fld('Tanggal','a','date',t.date||today())+fld('Nomor transaksi','b','text',t.no||'TRX-'+Date.now().toString().slice(-8))+'<label>Produk</label><div id="rows">'+t.items.map(row).join('')+'</div><button class="s" onclick="$(\'#rows\').insertAdjacentHTML(\'beforeend\',row())">+ Produk</button>'+`<label>Marketplace</label><select id="c">${opt(MP,t.mp)}</select><label>Metode pembayaran</label><select id="d">${opt(PAY,t.pay)}</select>`+fld('Catatan','e','text',t.notes),()=>txSave(id,t))}
async function txSave(id,old){
 const items=[...document.querySelectorAll('.it')].map(r=>{const pid=r.querySelector('.ip').value,p=S.p.find(x=>x.id==pid);return{pid,name:p?.name,q:+r.querySelector('.iq').value,sp:+r.querySelector('.is').value,cp:+r.querySelector('.ic').value}});
 if(!v('a')||!v('b')||!items.length)return toast('Field wajib tidak boleh kosong.'),false;
 for(const i of items){if(!i.name)return toast('Produk tidak ditemukan.'),false;if(!(i.q>0)||!Number.isInteger(i.q))return toast('Quantity harus lebih dari 0.'),false;if(!(i.sp>=0)||!(i.cp>=0))return toast('Harga tidak boleh negatif.'),false}
 
 const r=await sb.rpc('save_transaction',{p:{id:id||null,date:v('a'),no:v('b'),mp:v('c'),pay:v('d'),notes:v('e'),items:items.map(i=>({pid:i.pid,q:i.q,sp:i.sp,cp:i.cp}))}});
 if(r.error){toast(/stok/i.test(r.error.message)?'Stok produk tidak mencukupi.':'Terjadi kesalahan. Silakan coba lagi.');return false}
 await reload()}
async function txDel(id){if(!confirm('Hapus transaksi? Stok akan dikembalikan.'))return;const r=await sb.rpc('delete_transaction',{p_id:id});if(r.error)return toast('Terjadi kesalahan. Silakan coba lagi.');await reload()}
function txDetail(id){const t=S.t.find(x=>x.id==id);modal('Detail '+esc(t.no),`<p>${t.date} · ${esc(t.mp)} · ${esc(t.pay)}<br>${esc(t.notes)}</p>`+tbl(['Produk','Qty','Jual','Modal'],t.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${i.q}</td><td>${rp(i.sp)}</td><td>${rp(i.cp)}</td></tr>`))+`<p>Omzet ${rp(t.sales)} · Modal ${rp(t.cost)} · <b>Laba ${rp(t.profit)}</b></p>`)}
async function csv(){const c=calc(rng(R.k)),L=[['Tanggal','No','Marketplace','Omzet','Modal','Laba'],...c.t.map(x=>[x.date,x.no,x.mp,x.sales,x.cost,x.profit])];
 try{const d=await claude.use('downloads');await d.save({filename:'laporan-fincommerce.csv',data:L.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n')})}catch(e){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([L.map(r=>r.join(',')).join('\n')],{type:'text/csv'}));a.download='laporan-fincommerce.csv';a.click()}}
async function demo(){if(!confirm('Buat 5 produk, 10 transaksi, dan 5 pengeluaran demo?'))return;try{
 const P=[['Ayam Frozen','AYM-01','Daging',32000,45000,60],['Telur Ayam','TLR-01','Telur',24000,29000,80],['Pakan Ayam','PKN-01','Pakan',9000,13000,120],['Vitamin Ayam','VIT-01','Obat',6000,12000,50],['Kandang Mini','KDG-01','Peralatan',85000,130000,15]];
 const r=await sb.from('products').insert(P.map(p=>({name:p[0],sku:p[1],category:p[2],cost_price:p[3],selling_price:p[4],stock:p[5],minimum_stock:8}))).select('id,name');if(r.error)throw r.error;
 const pid=n=>r.data.find(x=>x.name==n).id,tag=Date.now().toString().slice(-5);
 for(let k=0;k<10;k++){const j=k%5,q=1+k%4;const x=await sb.rpc('save_transaction',{p:{id:null,date:iso(new Date(Date.now()-k*864e5*.7)),no:'DEMO-'+tag+'-'+(k+1),mp:MP[k%6],pay:PAY[k%4],notes:'Data demo',items:[{pid:pid(P[j][0]),q,sp:P[j][4],cp:P[j][3]}]}});if(x.error)throw x.error}
 const e=await sb.from('expenses').insert([['Iklan',150000],['Packing',60000],['Ongkir',90000],['Listrik',200000],['Internet',350000]].map((e,k)=>({date:iso(new Date(Date.now()-k*864e5)),category:e[0],amount:e[1],description:'Data demo'})));if(e.error)throw e.error;
 await reload()}catch(e){toast('Terjadi kesalahan. Silakan coba lagi.')}}
init();
</script></body></html>
